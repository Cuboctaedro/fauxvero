# Production stack for Coolify (Docker Compose build pack).
# MySQL runs as a separate Coolify resource; see DEPLOYMENT.md.
# ${VAR:?} is required and ${VAR:-x} has a default; Coolify shows them all in the UI.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Runs migrations, storage:link and the Laravel caches on every start.
      AUTORUN_ENABLED: "true"
      PHP_OPCACHE_ENABLE: "1"
      APP_NAME: "${APP_NAME:-Fauxvero}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?}"
      APP_URL: "${APP_URL:?}"
      APP_LOCALE: el
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:?}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:?}"
      DB_USERNAME: "${DB_USERNAME:?}"
      DB_PASSWORD: "${DB_PASSWORD:?}"
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: "${MAIL_MAILER:-log}"
    volumes:
      - storage:/var/www/html/storage/app

  # Generates the queued media conversions (e.g. the "web" image size).
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--max-time=3600"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
    environment:
      PHP_OPCACHE_ENABLE: "1"
      APP_NAME: "${APP_NAME:-Fauxvero}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?}"
      APP_URL: "${APP_URL:?}"
      APP_LOCALE: el
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:?}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:?}"
      DB_USERNAME: "${DB_USERNAME:?}"
      DB_PASSWORD: "${DB_PASSWORD:?}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: "${MAIL_MAILER:-log}"
    volumes:
      - storage:/var/www/html/storage/app

volumes:
  storage:
